name: gate

# El gate deja de servir en cuanto depende de que alguien se acuerde de
# correrlo. Un juicio encontró diez defectos en este repositorio y los encontró
# porque los buscamos a mano. Esto los busca solo.

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.6 es el mínimo que ejecuta TypeScript sin build. El repositorio
          # no tiene dependencias, así que no hay nada que instalar ni cachear.
          node-version: '22.x'

      - name: Correspondencia y reglas
        run: node --test "evals/*.test.ts"

      - name: El registro de cobertura está regenerado
        # `gen.ts` es determinista. Si el archivo commiteado difiere de lo que
        # produce, alguien lo editó a mano o cambió una skill sin regenerar.
        run: |
          node --experimental-strip-types evals/gen.ts
          git diff --exit-code evals/cobertura.ts

      # Acá no queda ninguna comprobación propia, y es a propósito.
      #
      # Hubo dos, y las dos fallaron por lo mismo: escritas como `grep -r`, sin
      # test que las probara. La de la raya usaba `grep -P '[\x{2014}]'`, un
      # escape que no es portable; grep respondía «character value too large» y
      # la inversión hacía que el paso aprobara sin comprobar nada. La de la
      # separación buscaba «cursor» suelto y disparó sobre la expresión «Tengo
      # un precursor.», que es contenido legítimo de un corpus.
      #
      # Las dos viven ahora en la suite, donde el patrón se escribe con
      # precisión y donde hay un test que comprueba que el guardián sigue
      # disparando. Un guardián silencioso es peor que ninguno, y uno que marca
      # lo legítimo se deja de leer.
